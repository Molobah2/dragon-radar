{% extends "base.html" %}
{% block title %}{{ err_title }} · {{ cfg.hub_name }}{% endblock %}
{% block body_class %}ready static-page{% endblock %}
{% block main %}
<section class="panel lost">
  <div class="lost-egg" aria-hidden="true">🥚</div>
  <h2>{{ err_title }}</h2>
  <p>{{ err_text }}</p>
  <div class="lost-go">
    <a class="lost-btn lost-main" href="{{ url_for('hub') }}">Back to Home</a>
    <a class="lost-btn" href="{{ url_for('feed') }}">Open Blinky's Friends</a>
  </div>
</section>
<style>
  .lost { padding: 40px 26px; margin-bottom: 26px; text-align: center; }
  .lost-egg { font-size: 54px; line-height: 1; margin-bottom: 10px; animation: lostWobble 2.6s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes lostWobble { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-9deg); } 86% { transform: rotate(8deg); } 93% { transform: rotate(-4deg); } }
  @media (prefers-reduced-motion: reduce) { .lost-egg { animation: none; } }
  .lost h2 { margin: 0 0 8px; font-family: var(--font-display); font-size: 30px; }
  .lost p { margin: 0 auto 20px; max-width: 460px; color: var(--ink-soft); font-weight: 600; }
  .lost-go { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .lost-btn { padding: 12px 20px; border-radius: 999px; font-weight: 800; text-decoration: none; color: var(--ink); background: rgba(255, 255, 255, .7); }
  .lost-main { background: linear-gradient(180deg, #ff8a5c, #f0643f); color: #fff; }
</style>
{% endblock %}
