# Manual collection runs. Scheduled collection is a Supabase cron job that calls /cron/collect.
# Secrets (repo Settings > Secrets and variables > Actions > Secrets): X_BEARER_TOKEN, DATABASE_URL
# Variable (same page > Variables): SITE_URL, e.g. https://dragon-radar.onrender.com
name: collect

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Collect now even if the last grab was recent (daily cap still applies)"
        type: boolean
        default: false

concurrency:
  group: collect-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  collect:
    # Scheduled collection now runs from a Supabase cron job calling /cron/collect.
    # This workflow stays for manual runs only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect posts
        run: python -m radar.collect
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MONTHLY_SPEND_LIMIT_USD: "20"
          FORCE_COLLECT: ${{ inputs.force && '1' || '0' }}
          DAILY_POST_CAP: "50"   # testing: newest 10 posts about every 5 hours. Set "0" for full collection.
